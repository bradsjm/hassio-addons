name: Addon-Hyperion-NG

on:
  pull_request:
    paths:
      - addon-hyperion-ng/**
      - addon-hyperion-ng/download-hyperion.sh
      - .github/workflows/addon-hyperion-ng.yml
      - .github/scripts/update-hyperion-version.sh
  push:
    branches:
      - main
    paths:
      - addon-hyperion-ng/**
      - addon-hyperion-ng/download-hyperion.sh
      - .github/workflows/addon-hyperion-ng.yml
      - .github/scripts/update-hyperion-version.sh
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: addon-hyperion-ng
  REGISTRY_PREFIX: docker.io/bradsjm

jobs:
  validate:
    name: Validate Hyperion release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: Validate version and release assets
        run: |
          set -euo pipefail
          python3 -m pip install --user 'PyYAML==6.0.2'
          version="$(python3 -c 'import yaml; print(yaml.safe_load(open("addon-hyperion-ng/config.yaml"))["version"])')"
          test -n "$version"
          test "$version" = "2.2.1"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          release="$(curl --fail --location --silent --show-error \
            "https://api.github.com/repos/hyperion-project/hyperion.ng/releases/tags/${version}")"
          jq -e --arg version "$version" '
            .assets | map(.name) | index("Hyperion-\($version)-Linux-amd64.tar.gz") != null and
            index("Hyperion-\($version)-Linux-arm64.tar.gz") != null
          ' <<< "$release" >/dev/null

          bash -n addon-hyperion-ng/download-hyperion.sh
          bash -n .github/scripts/update-hyperion-version.sh
          python3 - <<'PY'
          import yaml

          with open("addon-hyperion-ng/config.yaml") as config_file:
              config = yaml.safe_load(config_file)
          with open("addon-hyperion-ng/translations/en.yaml") as translation_file:
              translations = yaml.safe_load(translation_file)

          assert config["arch"] == ["amd64", "aarch64"]
          assert config["host_network"] is True
          assert "ports" not in config
          assert "ports_description" not in config
          assert config["image"] == "docker.io/bradsjm/addon-hyperion-ng"
          assert config["webui"] == "http://[HOST]:[PORT:8090]"
          assert config["options"]["admin_password"] == ""
          assert config["schema"]["admin_password"] == "password?"
          assert translations["configuration"]["admin_password"]["name"]
          assert translations["configuration"]["admin_password"]["description"]
          PY
          python3 -m unittest discover -s addon-hyperion-ng/tests -p 'test_*.py'

  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}

  build:
    name: Build ${{ matrix.arch }}
    needs:
      - validate
      - prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: addon-hyperion-ng
          image: ${{ matrix.image }}
          image-tags: ${{ needs.validate.outputs.version }}
          version: ${{ needs.validate.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=Hyperion.NG
            io.hass.description=Hyperion is an opensource Bias or Ambient Lighting implementation by the Hyperion-Project. This add-on is not supported or endorsed by the Hyperion Project and may not work with hardware capture cards or LED devices due to limitations of containers
          container-registry: docker.io
          container-registry-username: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USER) || 'unused' }}
          container-registry-password: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_PASSWORD) || 'unused' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  publish:
    name: Publish multi-architecture manifest
    needs:
      - validate
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          image-tags: ${{ needs.validate.outputs.version }}
          registry-prefix: ${{ env.REGISTRY_PREFIX }}
          container-registry: docker.io
          container-registry-username: ${{ secrets.DOCKERHUB_USER }}
          container-registry-password: ${{ secrets.DOCKERHUB_PASSWORD }}
