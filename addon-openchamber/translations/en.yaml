configuration:
  openchamber:
    name: OpenChamber
    description: OpenChamber web interface options.
    fields:
      port:
        name: Port
        description: Port for the OpenChamber web UI.
      version:
        name: OpenChamber version pin
        description: Pin OpenChamber to a specific version (for example 1.9.10). Leave empty to install latest on startup.
      data_dir:
        name: OpenChamber data directory
        description: Persistent storage directory for OpenChamber data.
  opencode:
    name: OpenCode
    description: OpenCode server options.
    fields:
      mode:
        name: OpenCode mode
        description: How OpenCode is provided; managed starts OpenCode internally, external connects to an existing server.
      host:
        name: External OpenCode host
        description: URL of the external OpenCode server (for example http://192.168.1.100:4096). Only used when mode is external.
      port:
        name: OpenCode port
        description: Port used by OpenCode. In managed mode this is the local OpenCode server port; in external mode this is the external server port.
      expose:
        name: Expose OpenCode API
        description: Bind managed OpenCode to all interfaces so external clients can connect directly to the OpenCode API port.
      version:
        name: OpenCode version pin
        description: Pin OpenCode to a specific version (for example 0.6.0). Only used when mode is managed. Leave empty to install latest on startup.
      env_vars:
        name: OpenCode environment variables
        description: Additional OPENCODE_ variables to export before startup, entered as KEY=value strings (for example OPENCODE_DISABLE_LSP_DOWNLOAD=true).
  password:
    name: Password
    description: Password for both the OpenChamber web UI and managed OpenCode server auth. OpenCode uses username opencode.
  packages:
    name: Debian Packages to Install
    description: Additional Debian packages to be installed and made available to OpenCode and OpenChamber.
  init_commands:
    name: Initialization Commands to run
    description: Terminal commands to run before OpenChamber is started.
