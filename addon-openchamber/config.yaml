# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: OpenChamber
version: "0.2"
slug: openchamber
description: OpenChamber web interface for OpenCode AI agent
url: "https://openchamber.dev/"
startup: application
host_network: false
apparmor: true
hassio_api: true
homeassistant_api: true
hassio_role: manager
stage: experimental
arch:
  - aarch64
  - amd64
init: false
ingress: false
map:
  - config:rw
  - share:rw
ports:
  3000/tcp: 3000
  4096/tcp: 4096
ports_description:
  3000/tcp: OpenChamber Web UI
  4096/tcp: OpenCode API (requires opencode.expose enabled)
webui: "http://[HOST]:[PORT:3000]"
options:
  openchamber:
    port: 3000
    version: ""
    data_dir: "/data/openchamber"
  opencode:
    mode: "managed"
    host: ""
    port: 4096
    expose: false
    version: ""
    env_vars: []
    config_dir: "/config/opencode"
    state_dir: "/data/opencode"
  password: ""
  packages: []
  init_commands: []
schema:
  openchamber:
    port: port
    version: str?
    data_dir: str?
  opencode:
    mode: "list(managed|external)"
    host: str?
    port: port?
    expose: bool?
    version: str?
    env_vars:
      - str
    config_dir: str?
    state_dir: str?
  password: password?
  packages:
    - str
  init_commands:
    - str
image: "bradsjm/{arch}-addon-openchamber"
